# ─────────────────────────────────────────────────────────────────────────────
# Google Cloud Build — JobSync API
#
# ALWAYS run via ./deploy.sh — never `gcloud run deploy --source`.
# Using --source bypasses this file, disables layer caching, and causes a
# full 550 MB cross-region push every time (~₹5-8 in network transfer alone).
#
# Layer caching strategy:
#   Step 1: Pull :latest so BuildKit can reuse cached layers
#   Step 2: Build with --cache-from=:latest (only changed layers rebuilt)
#   Step 3: Push (only changed layers transferred — typically < 10 MB)
#   Step 4: Deploy to Cloud Run
#
# With caching, incremental deploys push ~5-10 MB instead of 550 MB.
# That cuts the per-deploy Artifact Registry charge from ~₹5 to < ₹0.10.
# ─────────────────────────────────────────────────────────────────────────────

substitutions:
  _AR_HOSTNAME: asia-south1-docker.pkg.dev
  _AR_PROJECT_ID: jobsync-497608
  _AR_REPOSITORY: jobsync
  _SERVICE_NAME: jobsync
  _DEPLOY_REGION: asia-south1
  _CORS_ORIGINS: '["https://jobsynk.in","https://www.jobsynk.in","https://job-sync-gilt.vercel.app","https://job-sync-ujj14kals-projects.vercel.app","http://localhost:3000"]'

steps:
  # ── Step 1: Pull latest image so Docker can reuse cached layers ────────────
  # The `|| true` means the build continues even on first deploy (no image yet).
  - name: gcr.io/cloud-builders/docker
    id: pull-cache
    entrypoint: bash
    args:
      - -c
      - |
        docker pull $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:latest || true

  # ── Step 2: Build with layer cache ────────────────────────────────────────
  # Only :latest tag — no :COMMIT_SHA.
  # Pushing 2 tags = 2 AR entries = double vulnerability-scan charges ($0.26/image)
  # and confuses keep-latest-1 cleanup policy. One tag = one image = minimum cost.
  - name: gcr.io/cloud-builders/docker
    id: build
    waitFor: [pull-cache]
    args:
      - build
      - --file=backend/Dockerfile
      - --tag=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:latest
      - --cache-from=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:latest
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - backend/
    env:
      - DOCKER_BUILDKIT=1

  # ── Step 3: Push to Artifact Registry ─────────────────────────────────────
  # Only push :latest — avoids double push and double storage charge.
  - name: gcr.io/cloud-builders/docker
    id: push
    waitFor: [build]
    args:
      - push
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:latest

  # ── Step 4: Deploy to Cloud Run ───────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy
    waitFor: [push]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - --image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:latest
      - --region=$_DEPLOY_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --memory=2Gi
      - --cpu=2
      - --concurrency=8
      - --min-instances=0
      - --max-instances=3
      - --timeout=300
      - --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID
      # --update-env-vars: only updates listed vars, preserves all others already
      # set on Cloud Run (e.g. FIREBASE_SERVICE_ACCOUNT_JSON, RAZORPAY_*, ELEVENLABS_*).
      # Never use --set-env-vars here — it wipes everything not listed.
      - --update-env-vars=^|^APP_VERSION=$COMMIT_SHA|DEBUG=false|SECRET_KEY=b4a1e968e620500dd27b653d56ec565c78b14827516e1fbeec0384efa2609644|SUPABASE_URL=https://dzdziagugdcbkictslrt.supabase.co|SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6ZHppYWd1Z2RjYmtpY3RzbHJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NTcwMjYsImV4cCI6MjA5NTQzMzAyNn0.1nf7Um3PDSZMzHaBmf2bIzgEqzwpClEp1i_leRnLBYE|MAX_CONCURRENT_ANALYSES=8|MAX_CONCURRENT_LLM_CALLS=3|BACKEND_CORS_ORIGINS=$_CORS_ORIGINS|GOOGLE_CLIENT_ID=329097420297-1vkhlbuo9igbalo7mj30vik5652dm16h.apps.googleusercontent.com|GOOGLE_REDIRECT_URI=https://jobsync-329097420297.asia-south1.run.app/api/v1/gmail/callback|FRONTEND_URL=https://jobsynk.in

images:
  - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:latest

options:
  logging: CLOUD_LOGGING_ONLY
  diskSizeGb: 50
  machineType: E2_MEDIUM

timeout: 1800s
